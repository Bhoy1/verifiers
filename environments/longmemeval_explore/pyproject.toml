[project]
name = "longmemeval-explore"
description = "LongMemEval with REPL exploration: model navigates conversation history via Python sandbox, manages its own notes, answers questions"
tags = ["longmemeval", "memory", "exploration", "repl", "python-env", "context-management"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["longmemeval_explore.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 1
