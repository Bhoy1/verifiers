[project]
name = "poker-multi"
description = "Multi-player No-Limit Texas Hold'em Poker — multi-agent environment"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["poker_multi.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 2
rollouts_per_example = 3
num_players = 3
num_hands = 1
