[project]
name = "longmemeval-context"
description = "LongMemEval long-term memory benchmark: baseline (full history) and context (incremental fact management) modes"
tags = ["longmemeval", "memory", "multi-turn", "context-management", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.11",
    "RestrictedPython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["longmemeval_context.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 1
