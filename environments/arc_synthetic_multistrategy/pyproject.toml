[project]
name = "arc-synthetic-multistrategy"
description = "ARC Synthetic Multi-Strategy — two codegen actors solving ARC tasks in parallel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.9",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["arc_synthetic_multistrategy.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 4
levels = [1]
