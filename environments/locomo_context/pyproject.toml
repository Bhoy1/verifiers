[project]
name = "locomo-context"
version = "0.1.0"
description = "LoCoMo long-conversation memory benchmark: baseline (full history) and context (incremental fact management) modes"
tags = ["locomo", "memory", "multi-turn", "context-management", "eval"]
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.11",
    "datasets",
    "RestrictedPython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["locomo_context.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 1
