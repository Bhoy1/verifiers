[project]
name = "tau2-bench-context-separated"
description = "τ²-bench with separated context management: edit and respond in separate model calls for clean RL gradient control"
tags = ["tool-agent-user", "tool-use", "multi-turn", "context-management", "separated", "sierra-research"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.11",
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@337326e",
    "RestrictedPython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["tau2_bench_context_separated.py"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.verifiers.eval]
num_examples = -1
rollouts_per_example = 4
