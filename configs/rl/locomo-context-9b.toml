model = "Qwen/Qwen3.5-9B"
max_steps = 200
batch_size = 128
rollouts_per_example = 8
env_file = ["secrets.env"]

[sampling]
max_tokens = 32768

[[env]]
id = "bhoy1/locomo-context"
args = { mode = "context_rl", prompt_version = "v1", dataset_split = "train" }

[eval]
num_examples = -1
rollouts_per_example = 1

[[eval.env]]
id = "bhoy1/locomo-context"
args = { mode = "context_rl", prompt_version = "v1", dataset_split = "test" }
